name: CI

# 公开镜像仓库:push/PR 自动构建 + 冒烟,防止 src 改坏打包
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-plugin-browserctl/package-lock.json
      - run: npm ci
        working-directory: dsh-plugin-browserctl
      - run: node build.mjs
        working-directory: dsh-plugin-browserctl
      - run: node test/smoke.cjs
        working-directory: dsh-plugin-browserctl
      # 根 manifest(awesome-dsh-plugin gate 读它)与子包 manifest 必须不漂移,
      # files / screenshots.json 指向的文件必须存在
      - run: node scripts/check-manifests.mjs
