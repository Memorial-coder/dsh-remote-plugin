name: Release

# 公开镜像仓库:push main / 打 v* 标签 / 手动 dispatch → 自动判定发版、自动 bump、构建、
# 冒烟、打包「自包含插件包」并发布 GitHub Release(带更新介绍)。
#
# 发布产物是一个**解压即用**的插件目录(DSH「设置 → 插件 → 添加插件 → 选择本地目录」直接选它):
#
#   dsh-remote-plugin/            ← 包根,同时有 package.json 和 browserctl.py
#     package.json                ← DSH 插件清单(dsh.bundle.patch / dsh.client)
#     cordis.patch.yml
#     lib/index.js lib/client.js  ← 构建产物(host 半 + client 半)
#     src/ locale/ icon.svg README.md INSTALL.md LICENSE
#     browserctl.py               ← 闸机/隧道核心(只用 Python 标准库)
#     frpc.exe win_push.py push_toast.ps1 fix-antivirus.ps1
#     browserctl_pwa/             ← iOS 添加到主屏用的图标与 Service Worker
#     requirements.txt            ← 仅自建服务器时用得到(paramiko),官方托管模式不需要
#
# 关键约束(踩过坑,别改回去):
#   1. **不要打 node_modules**:`qrcode` 已在构建期内联进 lib/index.js,运行时零 npm 依赖;
#      以前带 node_modules 是因为 esbuild 把 qrcode 标成 external,clone 后必须 npm install。
#   2. **脱敏版 browserctl.py 必须一起打进去**:插件 host 半的运行核心就是它,缺了它插件
#      能装但点「开始控制」永远失败(找不闸机程序)。INSTALL.md 已写明包根必须同时有两个文件。
#   3. **zip 条目用正斜杠 + 单一顶层目录**:macOS/Linux 的 unzip 会把反斜杠当字面字符
#      (Windows 上正常,别的系统解出一堆乱名文件)。用 `cd dist/pkg && zip -r ... dsh-remote-plugin` 保证。
#   4. 版本号唯一来源 = dsh-plugin-browserctl/package.json;build.mjs 用它 define 进产物,
#      工作流只从它取版本,不手写版本。
#   5. **额外的 npm 兼容 .tgz**:awesome-dsh-plugin 商店的 `tarball:` 字段要求 GitHub Release
#      托管的 `https` `.tgz`。这里再打一份 `package/` 顶层目录的 tarball,资产名不带版本号
#      (`dsh-remote-plugin.tgz`),`releases/latest/download/` 才能稳定解析。
#
# 自动发版判定(2026-11-08 起,与 dsh-remote-android 仓库同款;判定逻辑本地 git-bash 试跑过):
#   - push 到 main:package.json 版本 ≠ 最近 v* 标签 → 按仓库版本直接发(工作区手动 bump 的老习惯);
#     版本相同但 HEAD 不是该标签(确实有新提交) → 自动 patch+1(`npm version` 会把
#     package.json 和 package-lock.json 一起改,否则 npm ci 因 lock 不同步直接失败),
#     以「chore(release): bump x.y.z」提交并推回 main;
#     当前版本已有同名标签 → 跳过(防机器人自推死循环;GITHUB_TOKEN 的 push 本身也不触发 workflow)。
#   - 推 v* 标签:按标签发,并强校验「标签版本 == package.json 版本」——防止 Release 名
#     是 v1.0.34、包里/资产名却是 1.0.33 的错位发布。
#   - Actions 手动 Run:可选 bump 档位(auto/patch/minor/major/none),可勾 dry_run 只打包不发布。
#   - **已发布过的版本绝不覆盖重发**(历史版本保留):Release 已存在时直接报错;要重发先删旧
#     Release(和标签),或换个新版本号。
#
# 注意:
#   - 自动 bump 会往 main 推一个提交,本地/同步工具下次操作前先 git pull --rebase。
#   - 工作区(08_WebAI助手/dsh-plugin-browserctl)仍是日常版本的源头;镜像自动 bump 只发生在
#     「推了内容但没改版本号」的场景,下次从工作区同步前把工作区版本改到不小于镜像版本。
#   - 官网「检查更新」用的 version.json(remote.ymzcc.com/dsh-remote/version.json)
#     是独立部署的,发版时需另行更新并部署,不归本 workflow 管。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', '.github/**', 'docs/**']
  workflow_dispatch:
    inputs:
      bump:
        description: '版本号怎么加'
        type: choice
        default: auto
        options: [auto, patch, minor, major, none]
      dry_run:
        description: '只构建不发布(试跑)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 自动 bump 推回 main、打标签、建 Release 都需要
  id-token: write # npm 可信发布(OIDC):不存任何密钥,由 npmjs.com 上的 Trusted Publisher 登记校验

jobs:
  release:
    name: 自动发版
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码(完整历史 + 标签)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-plugin-browserctl/package-lock.json
          registry-url: 'https://registry.npmjs.org' # OIDC 可信发布要求 .npmrc 指向官方源

      # ---------- 1. 决定:发不发、版本多少、要不要加号 ----------
      - name: 决定版本号
        id: decide
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./dsh-plugin-browserctl/package.json').version")"
          [ -n "$VERSION" ] || { echo "::error::没能从 dsh-plugin-browserctl/package.json 读到 version"; exit 1; }

          # 最近一个 v* 标签(按版本序排,不按时间)
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
          MODE=auto; BUMP=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # 老习惯:手动推标签,按标签发;标签与 package.json 必须一致,防 Release 名与包内版本错位
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "::error::标签 ${GITHUB_REF_NAME} 与 package.json 版本 ${VERSION} 不一致——先把 dsh-plugin-browserctl/package.json 改成一致再打标签"
              exit 1
            fi
            VERSION=${GITHUB_REF_NAME#v}
            LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)
            MODE=build
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${{ inputs.bump }}" in
              patch|minor|major) MODE=bump; BUMP="${{ inputs.bump }}" ;;
              none)              MODE=build ;;
              *)                 MODE=auto ;;
            esac
          fi

          LAST_VERSION=${LAST_TAG#v}
          if [ "$MODE" = "auto" ]; then
            if [ "$VERSION" != "$LAST_VERSION" ]; then
              MODE=build          # 提交里已手动加过号,按仓库版本发
            elif [ -n "$LAST_TAG" ] && [ "$(git rev-parse "${LAST_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              MODE=bump; BUMP=patch
            else
              MODE=skip           # 版本没动、标签就是 HEAD:机器人自推或无新东西
            fi
          fi

          if [ "$MODE" = "bump" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::版本号 ${VERSION} 不是 x.y.z 三段式,停"
              exit 1
            fi
            IFS=. read -r MAJ MIN PAT <<< "$VERSION"
            case "$BUMP" in
              minor) MIN=$((MIN+1)); PAT=0 ;;
              major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
              *)     PAT=$((PAT+1)) ;;
            esac
            VERSION="${MAJ}.${MIN}.${PAT}"
          fi

          # 同名标签已存在 = 发过了,跳过;tag-push 模式旁路(标签本来就是我们刚推的)
          if [ "$MODE" != "skip" ] && [ "${GITHUB_EVENT_NAME}:${GITHUB_REF_TYPE}" != "push:tag" ] \
             && git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} 已有标签,本次跳过"
            MODE=skip
          fi

          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "mode=${MODE}"
            echo "last_tag=${LAST_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}"    >> "$GITHUB_ENV"
          echo "决定:mode=${MODE},版本 v${VERSION},上一发版 ${LAST_TAG:-无}"

      # ---------- 2. 需要时把版本号写回 package.json + package-lock.json 并提交 ----------
      - name: 加版本号并提交
        id: bump
        if: steps.decide.outputs.mode == 'bump'
        run: |
          set -euo pipefail
          # npm version 用显式版本号,一次改齐 package.json 与 package-lock.json(npm ci 要求两者同步)
          (cd dsh-plugin-browserctl && npm version "${VERSION}" --no-git-tag-version --allow-same-version)
          # 仓库根 manifest 必须与子包同版:scripts/check-manifests.mjs 强校验,漏了这条 CI 永远红
          npm pkg set "version=${VERSION}"
          V="$(node -p "require('./dsh-plugin-browserctl/package.json').version")"
          R="$(node -p "require('./package.json').version")"
          [ "$V" = "$VERSION" ] || { echo "::error::版本号没写进去 V=$V 期望=${VERSION}"; exit 1; }
          [ "$R" = "$VERSION" ] || { echo "::error::根 manifest 版本没同步 R=$R 期望=${VERSION}"; exit 1; }
          grep -q "\"version\": \"${VERSION}\"" dsh-plugin-browserctl/package-lock.json \
            || { echo "::error::package-lock.json 版本没同步"; exit 1; }
          git add package.json dsh-plugin-browserctl/package.json dsh-plugin-browserctl/package-lock.json
          git commit -m "chore(release): bump ${VERSION}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ---------- 3. 构建 + 冒烟(skip 时全部条件跳过) ----------
      - name: Install deps (build only, no runtime deps)
        if: steps.decide.outputs.mode != 'skip'
        working-directory: dsh-plugin-browserctl
        run: npm ci

      - name: Build
        if: steps.decide.outputs.mode != 'skip'
        working-directory: dsh-plugin-browserctl
        run: npm run build

      - name: Test (smoke + layout)
        if: steps.decide.outputs.mode != 'skip'
        working-directory: dsh-plugin-browserctl
        run: npm test

      - name: Package self-contained plugin
        if: steps.decide.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          STAGE="dist/pkg/dsh-remote-plugin"
          rm -rf dist
          mkdir -p "$STAGE/lib" "$STAGE/src" "$STAGE/locale"

          # 1) 插件本体(包根就这些)
          cp dsh-plugin-browserctl/package.json \
             dsh-plugin-browserctl/cordis.patch.yml \
             dsh-plugin-browserctl/icon.svg \
             dsh-plugin-browserctl/README.md \
             "$STAGE/"
          cp dsh-plugin-browserctl/lib/index.js dsh-plugin-browserctl/lib/client.js "$STAGE/lib/"
          cp dsh-plugin-browserctl/src/index.js dsh-plugin-browserctl/src/client.jsx "$STAGE/src/"
          cp dsh-plugin-browserctl/locale/*.json "$STAGE/locale/"

          # 2) 运行核心(与 package.json 同层 = 插件能自包含找到闸机)
          cp browserctl.py frpc.exe win_push.py push_toast.ps1 fix-antivirus.ps1 \
             requirements.txt INSTALL.md LICENSE "$STAGE/"
          cp -r browserctl_pwa "$STAGE/browserctl_pwa"

          # 3) 自检:包根同时有两件套、无 node_modules、无脱敏残留
          test -f "$STAGE/package.json"
          test -f "$STAGE/browserctl.py"
          test -f "$STAGE/lib/index.js"
          test -f "$STAGE/lib/client.js"
          if find "$STAGE" -name node_modules | grep -q .; then
            echo "ERROR: 发布包里不该有 node_modules(qrcode 已内联)" >&2
            exit 1
          fi
          # 自检脱敏残留：待检字符串运行时拼装，本文件不出现生产内部信息字面量（2026-11-09 终审 F-13e）
          bad_ip='103.236.91'".7"
          bad_path='/ymz/1'"panel"
          bad_user='memo'"rial"
          bad_ctr='1Panel-open'"resty"
          for bad in "$bad_ip" "$bad_path" "$bad_user" "$bad_ctr"; do
            if grep -rIl -- "$bad" "$STAGE" >/dev/null 2>&1; then
              echo "ERROR: 发布包含生产内部信息（脱敏清单命中）" >&2
              exit 1
            fi
          done

          # 4) 打包:顶层目录 + 正斜杠(macOS/Linux unzip 友好)
          (cd dist/pkg && zip -r -q "dsh-remote-plugin-${VERSION}.zip" dsh-remote-plugin)
          cp "dist/pkg/dsh-remote-plugin-${VERSION}.zip" "dist/dsh-remote-plugin-${VERSION}.zip"

          # 5) npm 兼容的 .tgz(awesome-dsh-plugin `tarball:` 字段用;顶层目录必须是 package/)
          rm -rf dist/tgz && mkdir -p dist/tgz
          cp -r "$STAGE" dist/tgz/package
          (cd dist/tgz && tar -czf "$GITHUB_WORKSPACE/dist/dsh-remote-plugin.tgz" package)

      - name: Verify zip layout
        if: steps.decide.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          ZIP="dist/dsh-remote-plugin-${VERSION}.zip"
          echo "--- 包内文件清单 ---"
          unzip -l "$ZIP"
          # 反斜杠条目 = 非 Windows 解压坏掉
          if unzip -l "$ZIP" | grep -q '\\'; then
            echo "ERROR: zip 条目含反斜杠" >&2
            exit 1
          fi
          for f in dsh-remote-plugin/package.json dsh-remote-plugin/browserctl.py \
                   dsh-remote-plugin/lib/index.js dsh-remote-plugin/lib/client.js \
                   dsh-remote-plugin/frpc.exe dsh-remote-plugin/INSTALL.md; do
            unzip -l "$ZIP" | grep -q " $f$" || { echo "ERROR: zip 缺 $f" >&2; exit 1; }
          done
          # 解压后再用 node 实测插件入口能加载(模拟 DSH 加载 lib/index.js)
          rm -rf dist/unzip && mkdir -p dist/unzip
          unzip -q "$ZIP" -d dist/unzip
          node -e "import('./dist/unzip/dsh-remote-plugin/lib/index.js').then(m=>{if(!m||!m.inject)throw new Error('inject missing');console.log('host entry OK')})"

      - name: Verify tarball layout
        if: steps.decide.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          TGZ="dist/dsh-remote-plugin.tgz"
          # 先落盘再查,避免 `tar | grep -q` 在 set -o pipefail 下被 SIGPIPE 判失败
          tar -tzf "$TGZ" > dist/tgz.list
          echo "--- tarball 文件清单(前 40) ---"
          sed -n '1,40p' dist/tgz.list
          for f in package/package.json package/browserctl.py package/cordis.patch.yml \
                   package/lib/index.js package/lib/client.js package/frpc.exe; do
            grep -qx "$f" dist/tgz.list || { echo "ERROR: tgz 缺 $f" >&2; exit 1; }
          done
          # 顶层必须是 package/;出现裸 package.json 说明 tar 的 -C 目录不对
          if grep -qx 'package.json' dist/tgz.list; then
            echo "ERROR: tgz 顶层缺少 package/ 目录" >&2
            exit 1
          fi
          # 解压后用 node 实测插件入口能加载
          rm -rf dist/tgztest && mkdir -p dist/tgztest
          tar -xzf "$TGZ" -C dist/tgztest
          node -e "import('./dist/tgztest/package/lib/index.js').then(m=>{if(!m||!m.inject)throw new Error('inject missing');console.log('tarball host entry OK')})"

      # ---------- 4. 生成更新介绍(从提交记录) ----------
      - name: 生成更新介绍
        if: steps.decide.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          PREV="${{ steps.decide.outputs.last_tag }}"
          DATE=$(date +%Y-%m-%d)
          : > body.tmp
          if [ -n "$PREV" ]; then
            git log --pretty=%s "${PREV}..HEAD" > subj.tmp
          else
            git log -20 --pretty=%s > subj.tmp
          fi
          while IFS= read -r S; do
            [ -n "$S" ] || continue
            # 机器人自己的加号提交是纯噪音,整行跳过;手动加号提交的正文说明要保留
            case "$S" in "chore(release): bump ${VERSION}") continue ;; esac
            # 只剥 ASCII 标点:[:punct:] 在 C.UTF-8 下连「『( 等中文标点也剥,会吃掉正常句首
            C=$(printf '%s' "$S" \
              | sed -E 's/\(versionCode [0-9]+\)//g' \
              | sed -E 's/bump[ ]+(to[ ]+)?v?[0-9]+\.[0-9]+\.[0-9]+//g' \
              | sed -E 's/\bv[0-9]+\.[0-9]+\.[0-9]+//g' \
              | sed -E 's/\(\)//g' \
              | sed -E 's/^[a-zA-Z]+(\([^)]*\))?:[[:space:]]*//' \
              | sed -E 's/^[[:space:]!-/:-@\[-`{-~]+//' \
              | sed -E 's/[[:space:]]*[+—-]+[[:space:]]*$//')
            [ -n "$C" ] || continue
            printf -- '- %s\n' "$C" >> body.tmp
          done < subj.tmp
          if [ ! -s body.tmp ]; then printf -- '- 内部维护与优化\n' > body.tmp; fi
          {
            echo "dsh-remote-plugin v${VERSION}(${DATE})"
            echo
            cat body.tmp
            echo
            if [ -n "$PREV" ]; then
              echo "完整变更:${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...v${VERSION}"
            else
              echo "完整变更:${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/v${VERSION}"
            fi
          } > release-notes.md
          echo "----- 更新介绍 -----"
          cat release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # ---------- 5. 发布:推回 main + 打标签 + 建 Release ----------
      - name: 发布
        id: publish
        if: steps.decide.outputs.mode != 'skip' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 先推加号提交,再打标签(main 推失败就整步失败,不留半截状态)
          if [ "${{ steps.bump.outputs.committed }}" = "true" ]; then
            # 检出是 detached HEAD,本地未必有 main 分支,推 HEAD:main 最稳
            git push origin HEAD:main
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "${TAG}"
          fi
          git push origin "${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} 已有 Release——已发布过的版本不覆盖重发;要重发先删旧 Release(和标签)再触发,或换个新版本号"
            exit 1
          fi
          gh release create "${TAG}" \
            "dist/dsh-remote-plugin-${VERSION}.zip" \
            "dist/dsh-remote-plugin.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-remote-plugin v${VERSION}" \
            --notes-file release-notes.md \
            --latest
          echo "release=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"

      # ---------- 5.5 npm 同步发布(可信发布/OIDC,零密钥) ----------
      # 市场安装命令已自动切到 npm 源(dsh plugin add dsh-plugin-browserctl),这里把同一版本发上
      # npm,双平台保持一致。前置一次性配置:npmjs.com 包设置里登记 Trusted publisher =
      # (Memorial-coder / dsh-remote-plugin / release.yml)。失败不影响 GitHub Release,只记进摘要。
      - name: 发布到 npm(同步)
        if: steps.decide.outputs.mode != 'skip' && inputs.dry_run != true
        continue-on-error: true
        run: |
          npm install -g npm@latest
          if npm publish --provenance; then
            echo "✅ npm 已发布 dsh-plugin-browserctl@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ npm 发布失败——常见原因:npmjs.com 的 Trusted publisher 还没登记(Memorial-coder/dsh-remote-plugin / release.yml),或该版本 npm 已存在。GitHub Release 不受影响。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 试跑说明
        if: steps.decide.outputs.mode != 'skip' && inputs.dry_run == true
        run: |
          echo "dry_run=true:zip/tgz 已打包并上传到本页 Artifacts,没有推送、没有打标签、没有建 Release"

      - name: 跳过说明
        if: steps.decide.outputs.mode == 'skip'
        run: |
          echo "本次没有需要发的版本(v${VERSION} 已有标签),流水线直接结束"

      - name: 上传打包产物(Actions 页可下载)
        if: steps.decide.outputs.mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-remote-plugin-v${{ steps.decide.outputs.version }}
          path: |
            dist/dsh-remote-plugin-*.zip
            dist/dsh-remote-plugin.tgz
          if-no-files-found: error

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "### 自动发版"
            echo "- 决定:mode=${{ steps.decide.outputs.mode }},tag=${{ steps.decide.outputs.tag }}"
            echo "- 上一发版:${{ steps.decide.outputs.last_tag }}"
            if [ -n "${{ steps.publish.outputs.release }}" ]; then
              echo "- Release:${{ steps.publish.outputs.release }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
